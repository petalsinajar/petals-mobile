include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - riverpod_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  errors:
    # freezed/json_serializable annotations on factory constructors.
    invalid_annotation_target: ignore

# riverpod_lint 3 runs as an analysis_server_plugin (no custom_lint needed).
plugins:
  riverpod_lint: 3.1.0

linter:
  rules:
    # This is an app, not a published package: doc comments on every public
    # widget/provider add noise without value.
    public_member_api_docs: false
